<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AdLib | Hero concepts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23535BFE'/%3E%3Cpath d='M8 21l6-6 3 3 7-8' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=Roboto+Serif:opsz,wght@8..144,100..900&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=26">
<link rel="stylesheet" href="heroes.css?v=26">
</head>
<body class="hpage">

<header class="nav" id="top">
  <div class="nav__in">
    <a class="nav__logo" href="index.html" aria-label="Back to the AdLib page"><img src="assets/logo.svg" alt="AdLib" width="126" height="26"></a>
  </div>
</header>

<main>
  <section class="hero hero--x">
    <div class="hero__in">
      <div class="hero__copy">
        <h1>Scale your <span class="hl">programmatic</span> media buying smarter, faster, and <span class="hl">more profitably</span></h1>
        <p class="lede">Independent agencies and marketers in growth-mode use AdLib to scale programmatic performance without the complexity, cost, or overhead of traditional DSPs.</p>
        <div class="actions">
          <a class="btn btn--purple" href="https://getadlib.com/sign-up/">Get Started Now</a>
          <a class="btn btn--line" href="https://getadlib.com/contact/">Contact Sales</a>
        </div>
        <div class="rated"><img src="assets/badges/g2-logo-png_seeklogo-407782-1.png" alt="G2" width="26" height="26"><strong>4.7 / 5</strong><span>on G2</span></div>
      </div>
      <div class="hero__art">
        <div class="sw" id="sw">
          <div class="sv" data-v="1" role="img" aria-label="Eight scattered platform tasks untangle into one tree managed in AdLib"></div>
          <div class="sv" data-v="2" role="img" aria-label="Twelve platforms connect to AdLib in the centre, then one campaign goes live on all of them"></div>
          <div class="sv" data-v="3" role="img" aria-label="Platforms arranged on an arch, all feeding into AdLib at the centre"></div>
          <div class="sv" data-v="4" role="img" aria-label="One campaign in AdLib launches on five platforms at once"></div>
          <div class="sv" data-v="5" role="img" aria-label="Nine platforms flow into AdLib and come out as one report"></div>
        </div>
        <button type="button" class="replay" id="replay">Replay</button>
      </div>
    </div>
  </section>
</main>

<div class="switch" role="group" aria-label="Choose a concept">
  <span class="switch__hint" id="hint">Concept</span>
  <button type="button" data-v="1"><span>1</span><b> Untangle</b></button>
  <button type="button" data-v="2"><span>2</span><b> Hub</b></button>
  <button type="button" data-v="3"><span>3</span><b> Arch</b></button>
  <button type="button" data-v="4"><span>4</span><b> Command</b></button>
  <button type="button" data-v="5"><span>5</span><b> Funnel</b></button>
</div>

<script src="heroes.js?v=26"></script>
</body>
</html>
